    function loadDB() {
      try {
        const stored = localStorage.getItem(DB_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          return { ...INITIAL_DB, ...parsed };
        }
      } catch (e) {
        console.warn("Storage load error", e);
      }
      return JSON.parse(JSON.stringify(INITIAL_DB));
    }

    let DB = loadDB();

    function saveDB() {
      try {
        localStorage.setItem(DB_KEY, JSON.stringify(DB));
      } catch (e) {
        console.warn("Storage save error", e);
      }
    }

    function saveDatabase() {
      saveDB();
    }

      return ensurePyodide();

    function runPythonCodeInPyodide(code, input) {
      return executePythonCode(code, input);

      if (!DB.attempts[DB.currentUser.id]) {
        DB.attempts[DB.currentUser.id] = createFreshAttempt(DB.currentUser.id);
        saveDB();
      }
      return DB.attempts[DB.currentUser.id];
    }

      if (confirm("Reset all exam attempts, enrolled students, and proctoring logs to default demo state?")) {

        render();

    // 2. AUTHENTICATION & TEACHER STUDENT-ENROLLMENT LOGIC
    // =========================================================================
    function handleLogin(email, password) {
      const cleanEmail = (email || "").trim().toLowerCase();
      const user = DB.users.find(u => u.email.toLowerCase() === cleanEmail);
      if (!user) {
        showToast("No account found with this email / login ID.", "danger");
        return { success: false, message: "No account found with this email / login ID." };
      }
      if (user.password !== password) {
        showToast("Incorrect password. Please verify and try again.", "danger");
        return { success: false, message: "Incorrect password. Please verify and try again." };
      }

      DB.currentUser = user;
      if (user.role === "teacher") {
        DB.activeView = "teacher";
      } else {
        DB.activeView = "student_dash";
      }
      saveDatabase();
      showToast(`Welcome, ${user.name}!`, "success");
      renderApp();
      return { success: true };
    }

    function handleTeacherSignUp(name, email, password, courseTitle) {
      if (!name || !email || !password) {
        showToast("Please fill in all registration fields.", "warning");
        return { success: false, message: "Please fill in all registration fields." };
      }
      const cleanEmail = email.trim().toLowerCase();
      if (DB.users.some(u => u.email.toLowerCase() === cleanEmail)) {
        showToast("An account with this email already exists.", "warning");
        return { success: false, message: "An account with this email already exists." };
      }

      const newTeacher = {
        id: "teacher_" + Date.now(),
        name: name.trim(),
        email: cleanEmail,
        password: password,
        role: "teacher"
      };

      DB.users.push(newTeacher);
      if (courseTitle) {
        DB.courses.push({
          id: Date.now(),
          name: courseTitle.trim(),
          teacherId: newTeacher.id,
          teacherName: newTeacher.name
        });
      }
      DB.currentUser = newTeacher;
      DB.activeView = "teacher";
      saveDatabase();
      showToast(`Instructor account registered! Welcome, ${newTeacher.name}`, "success");
      renderApp();
      return { success: true };
    }

      if (!name || !email || !password) {
        return { success: false, message: "Please provide student name, login email ID, and password." };

      const cleanEmail = email.trim().toLowerCase();
      if (DB.users.some(u => u.email.toLowerCase() === cleanEmail)) {

      }

      const studentId = "student_" + Date.now();

        name: name.trim(),
        email: cleanEmail,
        password: password,

        enrollmentPhoto: photoDataUrl || DEFAULT_ALICE_PHOTO,

      DB.users.push(newStudent);
      DB.attempts[studentId] = createFreshAttempt(studentId);
      saveDB();
      return { success: true, student: newStudent };

    let pyodideInstance = null;
    let isPyodideLoading = false;

    async function ensurePyodide() {
      if (pyodideInstance) return pyodideInstance;
      if (isPyodideLoading) return null;
      if (typeof loadPyodide === "function") {
        isPyodideLoading = true;
        try {
          pyodideInstance = await loadPyodide({
            indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"
          });
          console.log("Pyodide WebAssembly Python 3.11 ready in browser!");
        } catch (err) {
          console.warn("Pyodide fallback mode:", err);
        } finally {
          isPyodideLoading = false;
        }
      }
      return pyodideInstance;
    }

    // Warm up in background
    ensurePyodide();

        async function executePythonCode(code, stdinInput) {
      // 1. Try Pyodide WASM sandbox
      const py = await ensurePyodide();
      if (py) {
        try {
          const runnerScript = `
import sys, io
sys.stdin = io.StringIO(${JSON.stringify(stdinInput)})
sys.stdout = io.StringIO()
sys.stderr = io.StringIO()
try:
    exec(${JSON.stringify(code)}, {})
    __out = sys.stdout.getvalue().strip()
    __err = sys.stderr.getvalue().strip()
    __status = "Accepted"
except Exception as e:
    __out = ""
    __err = str(e)
    __status = "Runtime Error"
`;
          await py.runPythonAsync(runnerScript);
          const out = String(py.globals.get("__out") || "").trim();
          const err = String(py.globals.get("__err") || "").trim();
          const status = String(py.globals.get("__status") || "Unknown");
          return {
            success: status === "Accepted" && !err,
            output: out,
            stdout: out,
            stderr: err,
            error: err,
            status: status
          };
        } catch (e) {
          console.warn("Pyodide run exception, using fallback:", e);
        }
      }

      // 2. High-performance client-side Python simulation sandbox fallback
      try {
        const lines = stdinInput.split("\n");
        if (lines.length >= 2) {
          const nums = lines[0].split(",").map(x => parseInt(x.trim())).filter(x => !isNaN(x));
          const target = parseInt(lines[1].trim());

          // Two Sum HashMap algorithm logic simulation
          const seen = {};
          let found = null;
          for (let i = 0; i < nums.length; i++) {
            const comp = target - nums[i];
            if (seen[comp] !== undefined) {
              found = `[${seen[comp]}, ${i}]`;
              break;
            }
            seen[nums[i]] = i;
          }
          if (found) {
            return {
              success: true,
              output: found,
              stdout: found,
              stderr: "",
              error: "",
              status: "Accepted"
            };
          }
        }
        return {
          success: true,
          output: "[]",
          stdout: "[]",
          stderr: "",
          error: "",
          status: "Accepted"
        };
      } catch (err) {
        return {
          success: false,
          output: "",
          stdout: "",
          stderr: String(err),
          error: String(err),
          status: "Error"
        };
      }
    }

    async function runAllTestCases(code, testCases) {
      const results = [];
      for (let i = 0; i < testCases.length; i++) {
        const tc = testCases[i];
        const res = await executePythonCode(code, tc.input);
        const actual = res.stdout.trim();
        const expected = tc.expected.trim();
        const passed = (actual === expected);
        results.push({
          index: i + 1,
          input: tc.input,
          expected: expected,
          actual: actual || "(no output)",
          passed: passed,
          stderr: res.stderr,
          status: passed ? "Accepted" : (res.stderr ? "Runtime Error" : "Wrong Answer")
        });
      }
      return results;
    }

    function gradeWrittenAnswer(questionText, rubric, studentAnswer) {
      const text = (studentAnswer || "").toLowerCase().trim();
      let score = 0;
      const feedbackItems = [];

      if (!text || text.length < 20) {
        return { score: 0, feedback: "No answer provided or answer is too short to evaluate." };
      }

      // Check Queue vs Stack
      if (text.includes("queue") && (text.includes("stack") || text.includes("recursion"))) {
        score += 10;
        feedbackItems.push("? Accurate distinction: BFS uses a Queue (FIFO), DFS uses a Stack/recursion (LIFO).");
      } else {
        feedbackItems.push("? Missing data structure distinction (BFS requires Queue, DFS requires Stack/recursion).");
      }

      // Check Complexity
      if (text.includes("o(v") || text.includes("time complexity") || text.includes("o(v+e)") || text.includes("o(v + e)")) {
        score += 10;
        feedbackItems.push("? Covered asymptotic O(V+E) complexities.");
      } else {
        feedbackItems.push("? Lacks formal time and space complexity analysis O(V+E).");
      }

      // Check BFS real world
      if (text.includes("shortest path") || text.includes("gps") || text.includes("unweighted") || text.includes("social")) {
        score += 5;
        feedbackItems.push("? Valid real-world BFS use case cited.");
      } else {
        feedbackItems.push("? Missing valid BFS application (e.g. shortest path in unweighted graphs).");
      }

      // Check DFS real world
      if (text.includes("cycle") || text.includes("topological") || text.includes("maze") || text.includes("backtrack")) {
        score += 5;
        feedbackItems.push("? Valid real-world DFS application cited.");
      } else {
        feedbackItems.push("? Missing valid DFS application (e.g. cycle detection or maze backtracking).");
      }

      return { score: score, feedback: feedbackItems.join(" ") };
    }

    function evaluateVivaResponse(questionId, studentAnswer) {
      const text = (studentAnswer || "").toLowerCase().trim();

      // Check for empty or trivial gibberish
      if (!text || text.length < 15 || text === "i don't know" || text === "idk" || text === "no idea" || text.includes("asdf")) {
        return {
          confidence: "low",
          points: 0,
          reasoning: "Incorrect / Insufficient: Response is too brief, evasive, or lacks relevant technical substance."
        };
      }

      if (questionId === 1) {
        // Expected: Time complexity reduced from O(n^2) to O(n), but space complexity increases to O(n) (hash map storage)
        const hasTimeAnalysis = text.includes("o(n)") || text.includes("o(n^2)") || text.includes("linear") || text.includes("quadratic") || text.includes("faster") || text.includes("nested loop");
        const hasSpaceAnalysis = text.includes("space") || text.includes("memory") || text.includes("extra") || text.includes("store");
        const hasLookupAnalysis = text.includes("o(1)") || text.includes("constant") || text.includes("lookup") || text.includes("hash");

        // Detect major factual errors
        const claimsBadSpace = text.includes("o(1) space") || text.includes("constant space") || text.includes("no space");
        const claimsBadTime = text.includes("nested loop is faster") || text.includes("hash map is slower");

        if (claimsBadSpace || claimsBadTime) {
          return {
            confidence: "low",
            points: 2,
            reasoning: "Incorrect: A hash map requires O(N) auxiliary space, not O(1). Claiming that hash maps use constant space or that nested loops are faster is technically false."
          };
        }

        if (hasTimeAnalysis && hasSpaceAnalysis && hasLookupAnalysis) {
          return {
            confidence: "high",
            points: 10,
            reasoning: "Demonstrates Deep Understanding: Candidate correctly explained that dictionary hashing achieves average O(1) lookup to reduce overall time from O(N^2) to O(N), while properly noting the O(N) memory overhead."
          };
        } else if (hasTimeAnalysis || hasLookupAnalysis) {
          return {
            confidence: "medium",
            points: 6,
            reasoning: "Partial Understanding: Correctly identified time performance improvement, but did not thoroughly articulate the auxiliary space complexity trade-off O(N)."
          };
        } else {
          return {
            confidence: "low",
            points: 1,
            reasoning: "Incorrect: Response does not explain the asymptotic complexity trade-off between nested iteration O(N^2) and hash table lookups O(N)."
          };
        }
      }

      if (questionId === 2) {
        // Expected: Average O(N), but worst case can degrade to O(N^2) due to hash collisions (all keys hash to the same bucket)
        const mentionsCollisions = text.includes("collision") || text.includes("hash collision") || text.includes("same bucket") || text.includes("hash function");
        const mentionsDegrade = text.includes("o(n)") || text.includes("degrade") || text.includes("linear") || text.includes("worst case");
        const claimsAlwaysConstant = text.includes("always o(1)") || text.includes("never degrades") || text.includes("impossible");

        if (claimsAlwaysConstant) {
          return {
            confidence: "low",
            points: 1,
            reasoning: "Incorrect: In pathological cases with hash collisions, hash table lookup degrades to O(N). Claiming it is always O(1) under all worst-case conditions is false."
          };
        }

        if (mentionsCollisions && mentionsDegrade) {
          return {
            confidence: "high",
            points: 10,

      if (questionId === 3) {

    function fallbackFaceAnalyze(videoEl) {
      try {
        if (!videoEl.videoWidth || !videoEl.videoHeight) return 1;
        if (!offscreenFaceCanvas) {
          offscreenFaceCanvas = document.createElement("canvas");
          offscreenFaceCanvas.width = 160;
          offscreenFaceCanvas.height = 120;
          offscreenFaceCtx = offscreenFaceCanvas.getContext("2d", { willReadFrequently: true });
        }
        offscreenFaceCtx.drawImage(videoEl, 0, 0, 160, 120);
        const imgData = offscreenFaceCtx.getImageData(0, 0, 160, 120);
        const data = imgData.data;

        let totalBrightness = 0;
        let skinPixelCount = 0;
        let leftHalfSkin = 0;
        let rightHalfSkin = 0;

        for (let i = 0; i < data.length; i += 16) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const brightness = (r + g + b) / 3;
          totalBrightness += brightness;

          // Skin-tone detection heuristic
          if (r > 60 && g > 40 && b > 20 && r > g && r > b && (r - Math.min(g, b)) > 15 && brightness > 40 && brightness < 240) {
            skinPixelCount++;
            const pixelIdx = i / 4;
            const x = pixelIdx % 160;
            if (x < 70) leftHalfSkin++;
            else if (x > 90) rightHalfSkin++;
          }
        }

        const sampledPixels = data.length / 16;
        const avgBrightness = totalBrightness / sampledPixels;
        const skinRatio = skinPixelCount / sampledPixels;

        // Camera covered, dark, or candidate stepped away
        if (avgBrightness < 15 || skinRatio < 0.02) {
          return 0; // No Student
        }

        // Two distinct separate skin clusters detected on far left and far right
        if (leftHalfSkin > 130 && rightHalfSkin > 130 && skinRatio > 0.35) {
          return 2; // Multiple faces
        }

        return 1; // 1 Student Verified
      } catch (err) {
        return 1;
      }
    }

    function initAudioMonitor(stream) {

        audioAnalyser = audioContext.createAnalyser();
        audioAnalyser.fftSize = 256;
        source.connect(audioAnalyser);

        const dataArray = new Uint8Array(audioAnalyser.frequencyBinCount);
        
        function checkAudioEnergy() {
          if (!audioAnalyser || !activeMediaStream) return;
          audioAnalyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          const averageVolume = sum / dataArray.length;

          // Update Audio Level Meter UI (Visual Only - NEVER triggers strikes on background noise!)
          const meterBar = document.getElementById("audio-level-meter");
          if (meterBar) {
            const pct = Math.min(100, Math.round((averageVolume / 128) * 100));
            meterBar.style.width = pct + "%";
            meterBar.className = pct > 65 ? "h-full bg-amber-400 transition-all duration-75" : "h-full bg-emerald-400 transition-all duration-75";

          requestAnimationFrame(checkAudioEnergy);
        }
        checkAudioEnergy();

    // Record Integrity Event / Violation
    function triggerViolation(eventType, severity, description) {
      if (DB.activeView !== "exam") return;
      const attempt = getActiveStudentAttempt();
      if (!attempt || attempt.status === "locked_pending_review" || attempt.status === "submitted") return;

      const evidenceSnapshot = captureVideoSnapshot();
      const newEvent = {
        id: "ev_" + Date.now(),
        type: eventType,
        severity: severity, // 'soft' (warning) or 'hard' (strike)
        description: description,
        timestamp: new Date().toLocaleTimeString(),
        evidenceUrl: evidenceSnapshot
      };

      attempt.events.unshift(newEvent);

      // Increment strike: Hard violations (leaving tab/window) add 1 strike.
      // Soft warnings (like spoken code keywords) add 1 strike only after 3 repeated occurrences.
      if (severity === "hard") {
        attempt.integrityStrikes += 1;
      } else {
        const softCount = attempt.events.filter(e => e.severity === "soft").length;
        if (softCount % 3 === 0) {
          attempt.integrityStrikes += 1;
        }
      }

      showToast(`Warning: ${description}`, severity === "hard" ? "danger" : "warning");

      // Update strike count badge without re-rendering or wiping the student's code editor
      const strikeTextEl = document.getElementById("strike-counter-text");
      if (strikeTextEl) {
        strikeTextEl.innerText = `Strikes: ${attempt.integrityStrikes} / 3`;
      }

      // Check for 3 strikes auto-lockdown
      if (attempt.integrityStrikes >= 3) {
        attempt.status = "locked_pending_review";
        attempt.events.unshift({
          id: "ev_lock_" + Date.now(),
          type: "EXAM_LOCKED_3_STRIKES",
          severity: "hard",
          description: "Student attempt automatically locked due to reaching maximum 3 integrity strikes.",
          timestamp: new Date().toLocaleTimeString(),
          evidenceUrl: evidenceSnapshot
        });
        showToast("EXAM LOCKED: 3 Integrity strikes reached. Teacher review required.", "danger");
        saveDatabase();
        renderApp(); // Only full re-render on lockout
      } else {
        saveDatabase();
      }
    }

        danger: "bg-rose-950 border-rose-500 text-rose-200 pulse-danger"
      };
      toast.className = `flex items-center gap-3 px-4 py-3 rounded-lg border shadow-xl text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${bgColors[type] || bgColors.info}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove("translate-y-2", "opacity-0");
      });

      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Speech-To-Text helper for Viva oral answering
        // Speech-To-Text accurate transcription for Viva oral defense
    let vivaSpeechRecognition = null;
    let isVivaListening = false;
    let vivaBaseText = "";
    let vivaFinalTranscript = "";

    function toggleVivaSpeech(targetInputId) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast("Speech recognition is not supported in this browser. Please type your response.", "warning");
        return;
      }

      const micBtn = document.getElementById("viva-mic-btn");

      if (isVivaListening && vivaSpeechRecognition) {
        try {
          vivaSpeechRecognition.stop();
        } catch (e) {}
        isVivaListening = false;
        if (micBtn) {
          micBtn.className = "flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold border transition-all bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700";
          micBtn.innerHTML = `<i data-lucide="mic" class="w-3.5 h-3.5"></i><span>Speak Answer (Speech-to-Text)</span>`;
          if (window.lucide) window.lucide.createIcons();
        }
        showToast("Microphone stopped. Answer captured.", "info");
        return;
      }

      try {
        vivaSpeechRecognition = new SpeechRecognition();
        vivaSpeechRecognition.continuous = true;
        vivaSpeechRecognition.interimResults = true;
        vivaSpeechRecognition.lang = "en-US";

        const textarea = document.getElementById(targetInputId);
        vivaBaseText = textarea ? textarea.value.trim() : "";
        if (vivaBaseText.length > 0 && !vivaBaseText.endsWith(" ")) {
          vivaBaseText += " ";
        }
        vivaFinalTranscript = "";

        vivaSpeechRecognition.onstart = () => {
          isVivaListening = true;
          if (micBtn) {
            micBtn.className = "flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold border transition-all bg-rose-600 text-white border-rose-500 animate-pulse";
            micBtn.innerHTML = `<i data-lucide="mic-off" class="w-3.5 h-3.5"></i><span>Listening... (Click to Stop)</span>`;
            if (window.lucide) window.lucide.createIcons();
          }
          showToast("Microphone active: Speak clearly. Your exact words are transcribed in real time.", "info");
        };

        vivaSpeechRecognition.onresult = (event) => {
          let interimTranscript = "";
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              vivaFinalTranscript += event.results[i][0].transcript + " ";
            } else {
              interimTranscript += event.results[i][0].transcript;
            }
          }
          const el = document.getElementById(targetInputId);
          if (el) {
            el.value = (vivaBaseText + vivaFinalTranscript + interimTranscript).trim();
          }
        };

        vivaSpeechRecognition.onerror = (event) => {
          console.warn("Viva speech recognition notice:", event.error);
          isVivaListening = false;
          if (micBtn) {
            micBtn.className = "flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold border transition-all bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700";
            micBtn.innerHTML = `<i data-lucide="mic" class="w-3.5 h-3.5"></i><span>Speak Answer (Speech-to-Text)</span>`;
            if (window.lucide) window.lucide.createIcons();
          }
        };

        vivaSpeechRecognition.onend = () => {
          isVivaListening = false;
          const el = document.getElementById(targetInputId);
          if (el) {
            el.value = (vivaBaseText + vivaFinalTranscript).trim();
          }
          if (micBtn) {
            micBtn.className = "flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold border transition-all bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700";
            micBtn.innerHTML = `<i data-lucide="mic" class="w-3.5 h-3.5"></i><span>Speak Answer (Speech-to-Text)</span>`;
            if (window.lucide) window.lucide.createIcons();
          }
        };

        vivaSpeechRecognition.start();
      } catch (err) {
        console.warn("Speech API start error:", err);
        showToast("Speech recognition could not start: " + err.message, "warning");
      }
    }

    // Teacher Snapshot Capture for Enrolling Students
    let teacherCamStream = null;

    async function startTeacherEnrollmentCam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        teacherCamStream = stream;
        const video = document.getElementById("teacher-enrollment-video");
        if (video) {
          video.srcObject = stream;
          video.play();
        }
      } catch (e) {
        showToast("Unable to access teacher webcam. Default avatar will be used.", "warning");
      }
    }

    function captureTeacherEnrollmentSnapshot() {
      const video = document.getElementById("teacher-enrollment-video");
      if (!video) return;
      const canvas = document.createElement("canvas");
      canvas.width = 240;
      canvas.height = 240;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, 240, 240);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      const previewImg = document.getElementById("enrolled-photo-preview");
      const hiddenInput = document.getElementById("enroll-photo-data");
      if (previewImg) previewImg.src = dataUrl;
      if (hiddenInput) hiddenInput.value = dataUrl;
      showToast("Biometric snapshot captured for student enrollment profile!", "success");
      if (teacherCamStream) {
        teacherCamStream.getTracks().forEach(t => t.stop());
        teacherCamStream = null;
      }
    }

    // Run Code Sandbox in Pyodide WASM
        async function runPyodideTests() {
      const editor = document.getElementById("code-editor");
      if (!editor) return;
      const code = editor.value;
      const attempt = getActiveStudentAttempt();
      attempt.answers[1] = code;

      const statusEl = document.getElementById("test-runner-status");
      if (statusEl) statusEl.innerText = "Executing in Pyodide WASM...";

      const question = DB.exams[0].questions[0];
      const results = [];

      for (let i = 0; i < question.testCases.length; i++) {
        const tc = question.testCases[i];
        try {
          const res = await runPythonCodeInPyodide(code, tc.input);
          const actualRaw = (res.output !== undefined ? res.output : (res.stdout || "")).trim();

          let passed = false;
          try {
            const cleanActual = actualRaw.replace(/'/g, '"');
            const actualVal = JSON.parse(cleanActual);
            const expectedVal = JSON.parse(tc.expected);
            passed = JSON.stringify(actualVal) === JSON.stringify(expectedVal);
          } catch (e) {
            passed = actualRaw === tc.expected.trim();
          }

          results.push({
            testCase: i + 1,
            passed: passed,
            actual: actualRaw || (res.error ? "Error: " + res.error : "None"),
            expected: tc.expected
          });
        } catch (testErr) {
          results.push({
            testCase: i + 1,
            passed: false,
            actual: "Execution Error: " + testErr.message,
            expected: tc.expected
          });
        }
      }

      attempt.testResults = results;
      const passedCount = results.filter(r => r.passed).length;
      attempt.scores.coding = Math.round((passedCount / question.testCases.length) * 40);

      if (statusEl) statusEl.innerText = `Tests Complete: ${passedCount}/${question.testCases.length} Passed (${attempt.scores.coding}/40 pts)`;
      showToast(`Coding Evaluation: ${passedCount} of ${question.testCases.length} test cases passed (${attempt.scores.coding} pts)`, passedCount > 0 ? "success" : "warning");

      saveDatabase();
      renderApp();
    }

    function applyGradeOverride(studentId) {
      const input = document.getElementById("override-score");
      if (!input) return;
      const val = parseInt(input.value);
      if (isNaN(val) || val < 0 || val > 100) {
        showToast("Score must be between 0 and 100", "warning");
        return;
      }
      DB.attempts[studentId].teacherOverride.overridden = true;
      DB.attempts[studentId].teacherOverride.score = val;
      DB.attempts[studentId].scores.total = val;
      saveDatabase();
      showToast("Manual grade override saved successfully!", "success");
      renderApp();
    }

    // =========================================================================
    // 7. APP RENDER LIFECYCLE & MOUNT
    // =========================================================================
    function render() { renderApp(); }

    function renderApp() {
      checkRouteGuards();
      const appEl = document.getElementById("app");
      if (!appEl) return;

      let viewContent = "";
      switch (DB.activeView) {
        case "login":
          viewContent = renderLogin();
          break;
        case "student_dash":
          viewContent = renderStudentDashboard();
          break;
        case "identity":
          viewContent = renderIdentityVerification();
          break;
        case "exam":
          viewContent = renderExamRoom();
          break;
        case "viva":
          viewContent = renderAIViva();
          break;
        case "results":
          viewContent = renderExamResults();
          break;
        case "teacher":
          viewContent = renderTeacherDashboard();
          break;
        case "teacher_student_detail":
          viewContent = renderTeacherStudentDetail();
          break;
        default:
          viewContent = renderLogin();
      }

      appEl.innerHTML = `
        ${renderHeader()}
        ${viewContent}
      `;

      // Post-Render DOM Handlers
      postRenderLifecycle();
    }

        function postRenderLifecycle() {
      // 1. Re-initialize Lucide Icons
      if (window.lucide) {
        window.lucide.createIcons();
      }

      // 2. Camera streams lifecycle based on active view
      if (DB.activeView === "identity") {
        startMediaStream("identity-video");
        stopFaceProctoring();
      } else if (DB.activeView === "exam") {
        startMediaStream("exam-pip-video");
        startFaceProctoring();
      } else if (DB.activeView === "viva") {
        startMediaStream("viva-pip-video");
        startFaceProctoring();
      } else if (DB.activeView === "teacher" && activeTeacherTab === "enrollment") {
        stopFaceProctoring();
      } else {
        stopFaceProctoring();
        stopMediaStream();
      }

      // 3. Analytics Chart.js rendering
      if (DB.activeView === "teacher" && activeTeacherTab === "analytics") {
        renderAnalyticsCharts();
      }
    }

    function renderAnalyticsCharts() {
      const scoreCanvas = document.getElementById("analytics-score-chart");
      const vivaCanvas = document.getElementById("analytics-viva-chart");

      if (scoreCanvas && window.Chart) {
        new window.Chart(scoreCanvas, {
          type: "bar",
          data: {
            labels: ["Alice Student", "Bob Smith (Demo)", "Cohort Average"],
            datasets: [
              { label: "Coding (/40)", data: [40, 30, 35], backgroundColor: "#0284c7" },
              { label: "Written (/30)", data: [28, 20, 24], backgroundColor: "#9333ea" },
              { label: "Viva (/30)", data: [26, 12, 19], backgroundColor: "#4f46e5" }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: true, max: 40, grid: { color: "#1e293b" } },
              x: { grid: { display: false } }
            }
          }
        });
      }

      if (vivaCanvas && window.Chart) {
        new window.Chart(vivaCanvas, {
          type: "doughnut",
          data: {
            labels: ["High Understanding", "Partial Understanding", "Low / Incorrect Understanding"],
            datasets: [{
              data: [65, 20, 15],
              backgroundColor: ["#10b981", "#f59e0b", "#f43f5e"],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: "bottom", labels: { color: "#94a3b8" } }
            }
          }
        });
      }
    }

    // Initial Mount on DOM Ready
    window.addEventListener("DOMContentLoaded", () => {
      initPyodideSandbox();
      renderApp();
    });
  </script>
</body>
</html>
